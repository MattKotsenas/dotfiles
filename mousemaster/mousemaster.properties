# mousemaster will automatically convert the key aliases to your current keyboard layout.
# However, if you want to make a change to the key aliases, and your keyboard layout
# is not us-qwerty, then remove .us-qwerty
key-alias.enablemod.us-qwerty=leftalt
key-alias.enablekey.us-qwerty=i
# 'exit' alias (was q p) removed: q and p are also hint keys, so they were ambiguous
# in hint modes. esc is now the single exit (steps back a level; quits from normal).
key-alias.clickthendisable.us-qwerty=.
key-alias.up.us-qwerty=k
key-alias.down.us-qwerty=j
key-alias.left.us-qwerty=h
key-alias.right.us-qwerty=l
key-alias.wheelup.us-qwerty=,
key-alias.wheeldown.us-qwerty=m
key-alias.wheelleft.us-qwerty=u
key-alias.wheelright.us-qwerty=o
key-alias.leftbutton.us-qwerty=;
key-alias.rightbutton.us-qwerty='
key-alias.middlebutton.us-qwerty=rightshift
key-alias.toggleleft.us-qwerty=n
# Cursor speed: normal (no modifier) / fine (hold d) / superfine (hold s). Both speed
# keys are plain home-row keys, NOT modifiers. mousemaster regurgitates un-eaten held
# keys back to the focused app when they stop being a prefix of any combo; a modifier
# like leftshift (overloaded as slow/windowmod/hint2mod) leaked shift+h to the app
# (e.g. Vimium "back" in Edge). Plain keys eat cleanly (see eatspeedmods below).
# (fast/v+b was dropped - it wasn't noticeably faster than normal.)
key-alias.slow.us-qwerty=d
key-alias.superslow.us-qwerty=s
key-alias.grid.us-qwerty=g
key-alias.windowmod.us-qwerty=leftshift
key-alias.hint.us-qwerty=f
key-alias.hint2mod.us-qwerty=leftshift
key-alias.uihintmod.us-qwerty=leftalt
key-alias.screenselection.us-qwerty=c
key-alias.navigateback.us-qwerty=h
key-alias.navigateforward.us-qwerty=y
key-alias.hint1key.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
key-alias.extendedhint1key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.extendedhint2key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
key-alias.hintscreenselectionkey.us-qwerty=j k l ; a s d f g
key-alias.arrowmod.us-qwerty=leftalt
key-alias.arrowkey.us-qwerty=up down left right

idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true

# Activation: primary is CAP ` (backtick) via kanata, which taps F13; mousemaster
# processes it because the wpm unit runs --ignore-injected-events=false (kanata emits
# via SendInput = injected, which upstream v88 hard-drops - fork petoncle/mousemaster#66).
# leftalt+i is kept as a physical fallback. 'i' is a free right-hand key that isn't a
# common Alt-menu mnemonic (unlike the old leftalt+e, which opened the Edit menu).
idle-mode.to.normal-mode=+enablemod +enablekey | _{enablemod} +enablekey | +f13

normal-mode.indicator.enabled=true
normal-mode.indicator.idle.color=#6C7086
normal-mode.indicator.move.color=#CBA6F7
normal-mode.indicator.wheel.color=#F9E2AF
normal-mode.indicator.mouse-press.color=#A6E3A1
# The following keys quit back to idle mode:
# esc (also steps back from sub-modes; from normal-mode it quits), click-then-disable
# key (.), leftalt + i, leftctrl + f, leftctrl + l, leftctrl + e, f2, f3, /.
normal-mode.to.idle-mode=+esc | -clickthendisable | +enablemod +enablekey | _{enablemod} +enablekey \
  | _{leftctrl} #f | _{leftctrl} #l | _{leftctrl} #e | #f2 | #f3 | #/
normal-mode.mouse.initial-velocity=1000
normal-mode.mouse.max-velocity=2200 | _{slow} ^{superslow} -> 350 | _{superslow} -> 75
normal-mode.mouse.acceleration=3000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} ^{superslow} -> 200 | _{superslow} -> 50
normal-mode.wheel.acceleration=500
# Start moving with direction keys.
normal-mode.start-move.up=^{arrowmod} +up
normal-mode.start-move.down=^{arrowmod} +down
normal-mode.start-move.left=^{arrowmod} +left
normal-mode.start-move.right=^{arrowmod} +right
# Stop moving by releasing direction keys.
# If the grid/hint/screenselection key is pressed, then stop moving.
normal-mode.stop-move.up=-up | +grid | +hint | +screenselection
normal-mode.stop-move.down=-down | +grid | +hint | +screenselection
normal-mode.stop-move.left=-left | +grid | +hint | +screenselection
normal-mode.stop-move.right=-right | +grid | +hint | +screenselection
# Register leftctrl to allow ctrl-clicking.
normal-mode.press.left=_{none | leftctrl} +leftbutton | _{none | leftctrl} +clickthendisable
normal-mode.press.middle=+middlebutton
normal-mode.press.right=_{none | leftctrl} +rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.toggle.left=_{none | leftctrl} +toggleleft
normal-mode.start-wheel.up=+wheelup
normal-mode.start-wheel.down=+wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup
normal-mode.stop-wheel.down=-wheeldown
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright

# Eat the speed-modifier presses (slow=d, superslow=s) while in normal mode so they
# never reach the focused app. mousemaster regurgitates un-eaten held keys to the
# focused app; eating here blocks that (it still tracks them as held for the velocity
# calc, so the speed change still applies).
normal-mode.noop.eatspeedmods=+slow | +superslow

# (edge-snap mode removed: it was triggered by holding rightalt, which caused a
# confusing "jump to screen edge". rightalt is now unbound in mouse mode.)

# Grid is enabled with g, disabled with g or esc.
# Press direction keys to shrink the grid in one direction.
normal-mode.to.grid-mode=^{windowmod} +grid
grid-mode.to.normal-mode=+grid | +esc
grid-mode.indicator=normal-mode.indicator
grid-mode.grid.area=active-screen
grid-mode.grid.area-width-percent=0.99
grid-mode.grid.area-height-percent=0.99
grid-mode.grid.synchronization=mouse-follows-grid-center
grid-mode.grid.line-visible=true
grid-mode.grid.line-color=#CBA6F7
grid-mode.shrink-grid.up=+up
grid-mode.shrink-grid.down=+down
grid-mode.shrink-grid.left=+left
grid-mode.shrink-grid.right=+right

# Window mode is enabled by holding windowmod and pressing the grid key (g).
# It is exited as soon as windowmod is released.
# Move to the active window's edges with direction keys.
# Move to the active window's center with the grid key (g).
normal-mode.noop.eatwindowmod=+windowmod
normal-mode.to.window-mode=_{windowmod} +grid
window-mode.to.normal-mode=-windowmod
window-mode.indicator=normal-mode.indicator
window-mode.grid.area=active-window
# Top inset to be able to quickly access a window's title bar (and potentially grab it and move the window).
window-mode.grid.area-top-inset=15
window-mode.grid.synchronization=mouse-follows-grid-center
window-mode.grid.row-count=1
window-mode.grid.column-count=1
window-mode.grid.line-visible=true
window-mode.grid.line-color=#CBA6F7
window-mode.snap.up=+up
window-mode.snap.down=+down
window-mode.snap.left=+left
window-mode.snap.right=+right
window-mode.move-to-grid-center=+grid

# Hints are enabled with f, disabled with f or esc.
# Two-level: f shows a coarse grid; selecting a cell shows a finer grid inside that box
# to refine (cursor only teleports on the final pick). See hint1/hint2 config below.
normal-mode.to.hint1-mode=^{uihintmod} +hint
# Esc/backspace exit to normal-mode. Selecting a hint instead auto-zooms (hint2 below).
hint1-mode.to.normal-mode=+esc | +backspace
# Prevent final hint key press from executing commands in next mode (e.g. n -> toggle left click)
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.hint.type=grid
hint1-mode.hint.grid-area=active-screen
hint1-mode.hint.active-screen-grid-area-center=screen-center
hint1-mode.hint.grid-cell-width=320
hint1-mode.hint.grid-cell-height=200
hint1-mode.hint.layout-row-count=6
hint1-mode.hint.layout-column-count=5
hint1-mode.hint.selection-keys=hint1key
# Don't move the cursor when picking a coarse cell - only the final hint2 pick teleports.
# Keeps hover menus open while you refine. (Docs: use no-movement when the next mode is
# another hint grid.)
hint1-mode.hint.mouse-movement=no-movement
hint1-mode.hint.select=_{none | hint2mod} +extendedhint1key
hint1-mode.hint.font-name=Segoe UI
hint1-mode.hint.box-color=#1E1E2E | _{hint2mod} -> #45475A
hint1-mode.hint.prefix-box-enabled=true
hint1-mode.hint.prefix-in-background=false
hint1-mode.hint.prefix-font-name=Segoe UI Light
hint1-mode.hint.prefix-font-size=64
hint1-mode.hint.prefix-font-color=#F9E2AF
hint1-mode.hint.prefix-selected-font-color=#CCCCCC
hint1-mode.hint.prefix-font-opacity=0.55
hint1-mode.hint.prefix-font-shadow-opacity=0
hint1-mode.hint.selected-font-opacity=0.5
# Hint configuration for a 4K screen:
hint1-mode.hint.grid-cell-width.3840x2160=480
hint1-mode.hint.grid-cell-height.3840x2160=430
hint1-mode.hint.layout-row-count.3840x2160=4
hint1-mode.hint.layout-column-count.3840x2160=10
hint1-mode.hint.selection-keys.3840x2160=extendedhint1key
# Hint configuration for a QHD screen:
hint1-mode.hint.grid-cell-width.2560x1440=320
hint1-mode.hint.grid-cell-height.2560x1440=290
hint1-mode.hint.layout-row-count.2560x1440=4
hint1-mode.hint.layout-column-count.2560x1440=10
hint1-mode.hint.selection-keys.2560x1440=extendedhint1key
# Hint configuration for a UWQHD screen:
hint1-mode.hint.grid-cell-width.3440x1440=430
hint1-mode.hint.grid-cell-height.3440x1440=290
hint1-mode.hint.layout-row-count.3440x1440=4
hint1-mode.hint.layout-column-count.3440x1440=10
hint1-mode.hint.selection-keys.3440x1440=extendedhint1key
hint1-mode.hint.undo=+backspace

# Selecting a hint1 cell drops into hint2-mode: a 2nd, finer hint pass within that box
# (no zoom) to refine to a precise click. In hint2, pick a letter to land the cursor,
# esc to accept the coarse spot, backspace to re-pick.
hint1-mode.noop.eathintmod=+hint2mod
hint1-mode.to.hint2-mode=+extendedhint1key
hint2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-mode.to.hint1-mode=_{none | hint2mod} +backspace
hint2-mode.to.normal-mode=+esc | _{none | hint2mod} +extendedhint1key
hint2-mode.break-combo-preparation=_{none | hint2mod} +extendedhint1key
hint2-mode.hint=hint1-mode.hint
hint2-mode.hint.type=grid
hint2-mode.hint.grid-area=active-screen
hint2-mode.hint.active-screen-grid-area-center=last-selected-hint
# hint2 = a fine grid over just the picked hint1 cell, NO zoom (zoom magnified the image
# but not the grid, so they desynced). 5x8 cells sized per-monitor to the hint1 cell, so
# selecting a coarse box subdivides it for a precise click.
hint2-mode.hint.grid-max-row-count=5
hint2-mode.hint.grid-max-column-count=8
hint2-mode.hint.grid-cell-width=40
hint2-mode.hint.grid-cell-height=40
hint2-mode.hint.select=+extendedhint2key
hint2-mode.hint.selection-keys=extendedhint2key
# Final pick: teleport the cursor to the selected spot (overrides hint1's no-movement).
hint2-mode.hint.mouse-movement=mouse-follows-selected-hint
hint2-mode.hint.box-color=#1E1E2E
hint2-mode.hint.prefix-in-background=false
hint2-mode.hint.prefix-box-enabled=false
# Cell sizes per monitor = hint1 cell / (8 cols x 5 rows):
hint2-mode.hint.grid-cell-width.3840x2160=60
hint2-mode.hint.grid-cell-height.3840x2160=86
hint2-mode.hint.grid-cell-width.2560x1440=40
hint2-mode.hint.grid-cell-height.2560x1440=58
hint2-mode.hint.grid-cell-width.3440x1440=54
hint2-mode.hint.grid-cell-height.3440x1440=58

# Screen selection is enabled with c, disabled with c or esc.
normal-mode.to.screen-selection-mode=+screenselection
screen-selection-mode.to.normal-mode=+screenselection | +esc | +backspace | +hintscreenselectionkey
screen-selection-mode.break-combo-preparation=+hintscreenselectionkey
screen-selection-mode.hint.type=grid
screen-selection-mode.hint.grid-area=all-screens
screen-selection-mode.hint.grid-max-row-count=1
screen-selection-mode.hint.grid-max-column-count=1
screen-selection-mode.hint.selection-keys=hintscreenselectionkey
screen-selection-mode.hint.font-size=120

# UI hints are enabled by pressing f while holding uihintmod.

# Remappings.
normal-mode.macro.navigateback=+navigateback -> +leftalt +leftarrow -leftarrow -leftalt
normal-mode.macro.navigateforward=+navigateforward -> +leftalt +rightarrow -rightarrow -leftalt

idle-mode.macro=_arrowremapping-mode.macro
normal-mode.macro=_arrowremapping-mode.macro
key-alias.arrowextramod=leftshift leftctrl leftwin
_arrowremapping-mode.macro.pressarrow=\
  +arrowmod {#*arrowextramod?} +arrowkey | _{arrowmod | arrowmod arrowextramod} +arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowmod +arrowkey
_arrowremapping-mode.macro.releasearrow=_{arrowmod} -arrowkey \
  -> arrowkey=uparrow downarrow leftarrow rightarrow \
  -> -arrowkey
_arrowremapping-mode.macro.releaseallarrows=_{arrowkey} -arrowmod -> -uparrow -leftarrow -downarrow -rightarrow
key-alias.arrowhandledkey=arrowkey arrowextramod enablekey
_arrowremapping-mode.macro.repressalt=_{arrowmod} ^{arrowkey} #!arrowhandledkey -> +arrowmod

idle-mode.to.begin-alt-tab-mode=_{leftalt} #tab
normal-mode.to.begin-alt-tab-mode=_{leftalt} #tab
# The Alt Tab menu process name is Explorer.EXE.
# We want to center the mouse on the active window as soon as the Alt Tab menu is not
# the active window anymore.
# 1. Wait for the release of leftalt.
begin-alt-tab-mode.to.end-alt-tab-mode=-leftalt
# 2.a Wait for Explorer.EXE to lose focus.
end-alt-tab-mode.to.center-on-active-window-mode=^{Explorer.EXE}
# 2.b Fallback: if Explorer.EXE is still active 200ms after leftalt release, go back.
end-alt-tab-mode.to.previous-mode-from-history-stack=#{*}-2000
# 3. Center the mouse on the (newly) active window, then switch back.
center-on-active-window-mode.grid.area=active-window
center-on-active-window-mode.grid.synchronization=mouse-follows-grid-center
# Immediately switch back to previous mode after centering the mouse.
center-on-active-window-mode.to.previous-mode-from-history-stack=wait-0

# thicker grid lines for visibility
grid-mode.grid.line-thickness=3
window-mode.grid.line-thickness=3

# Mocha cursor ring (replaces default red inner-outline)
normal-mode.indicator.idle.inner-outline-color=#CBA6F7
normal-mode.indicator.idle.inner-outline-thickness=1
normal-mode.indicator.idle.outer-outline-color=#11111B
normal-mode.indicator.idle.outer-outline-thickness=1
# Hint labels: high-contrast Mocha text (#CDD6F4) with a crisp dark drop-shadow.
# (Was mauve #CBA6F7 - too low-contrast on the dark box, and the default soft shadow
# read as a glow at hint density.)
hint1-mode.hint.font-color=#CDD6F4
hint1-mode.hint.font-shadow-color=#000000
hint1-mode.hint.font-shadow-opacity=1.0
hint1-mode.hint.font-shadow-blur-radius=0

# hint grid (prefix box border): subtle Mocha frame instead of yellow
hint1-mode.hint.prefix-box-border-color=#45475A
hint1-mode.hint.prefix-box-border-thickness=2
