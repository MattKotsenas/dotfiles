- defaults:
    link:
      relink: true
      create: true
      glob: true

- clean: ['~']

- link:
    ~/Documents/PowerShell: pwsh/**
    ~/.config/git: git/**
    ~/.config/thefuck: thefuck/**
    ~/.config/eza: eza/**
    ~/.config/bat: bat/**
    ~/.config/komorebi: komorebi/**
    $LOCALAPPDATA/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json: wt/settings.json
    ~/.config/whkdrc: whkd/whkdrc
    ~/.config/wpm: wpm/**
    ~/.config/kanata: kanata/**
    ~/.copilot/copilot-instructions.md: copilot/copilot-instructions.md
    ~/.copilot/config.json: copilot/config.json
    ~/.copilot/mcp-config.json: copilot/mcp-config.json
    $LOCALAPPDATA/nvim: nvim/**
    $APPDATA/Code/User/settings.json: vscode/settings.json
    $APPDATA/Code/User/keybindings.json: vscode/keybindings.json

- shell:
  - command: winget configure configuration.dsc.yaml
    description: Running winget configure
    stdin: true
    stdout: true
    stderr: true
  - command: bat cache --build
    description: Building bat cache
    stdout: true
    stderr: true
  - command: copilot plugin marketplace add aaronontheweb/dotnet-skills || echo "Marketplace already registered"
    description: Registering dotnet-skills marketplace
    stdout: true
    stderr: true
  - command: copilot plugin marketplace add mattkotsenas/agent-plugins || echo "Marketplace already registered"
    description: Registering agent-plugins marketplace
    stdout: true
    stderr: true
  - command: copilot plugin install dotnet-skills@dotnet-skills
    description: Installing dotnet-skills plugin
    stdout: true
    stderr: true
  - command: copilot plugin install delve@agent-plugins
    description: Installing delve plugin
    stdout: true
    stderr: true
  - command: copilot plugin install yes-milord@agent-plugins
    description: Installing yes-milord plugin
    stdout: true
    stderr: true
  - command: copilot plugin install richlander/dotnet-inspect
    description: Installing dotnet-inspect plugin
    stdout: true
    stderr: true
