- defaults:
    link:
      relink: true
      create: true
      glob: true

- clean: ['~', '~/.copilot']

# Recursively prune dangling symlinks from dotbot-managed dirs that use
# per-file globbing (otherwise removing a file from the repo leaves an
# orphaned symlink behind, since dotbot only cleans the dirs you ask it to).
- clean:
    ~/.config:
      recursive: true
    ~/Documents/PowerShell:
      recursive: true
    ~/.psmux:
      recursive: true
    ~/.copilot/instructions:
      recursive: true
    ~/.copilot/agents:
      recursive: true
    $LOCALAPPDATA/nvim:
      recursive: true

- link:
    # Don't use /** for powershell, as otherwise each file gets its own symlink, which is annoying when testing changes
    # to the scripts. Instead use glob: false for the scripts directory, so that only one symlink is created for the
    # whole directory.
    # You shouldn't symlink the whole powershell directory, as that would include the module manifest, which would cause
    # problems with importing the module.
    ~/Documents/PowerShell:
      path: pwsh/*
      exclude: [pwsh/scripts]
    ~/Documents/PowerShell/scripts:
      path: pwsh/scripts
      glob: false
    ~/.config/git: git/**
    ~/.config/pay-respects: pay-respects/**
    ~/.config/eza: eza/**
    ~/.config/bat: bat/**
    ~/.config/komorebi:
      path: komorebi
      glob: false
    $LOCALAPPDATA/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json: wt/settings.json
    ~/.config/keyboard:
      path: keyboard
      glob: false
    ~/.psmux.conf: psmux/.psmux.conf
    ~/.wslconfig: wsl/.wslconfig
    ~/.psmux/strategies:
      path: psmux/strategies
      glob: false
    ~/.psmux/scripts:
      path: psmux/scripts
      glob: false
    ~/.config/wpm: wpm/**
    ~/.config/kanata: kanata/**
    ~/.config/mousemaster: mousemaster/**
    ~/.copilot/instructions: copilot/instructions/**
    ~/.copilot/agents: copilot/agents/**
    ~/.copilot/extensions/turn-budget:
      path: copilot/extensions/turn-budget
      glob: false
    ~/.copilot/preferences.yaml: copilot/preferences.yaml
    ~/.copilot/measure-twice/config.json: copilot/measure-twice/config.json
    $LOCALAPPDATA/nvim: nvim/**
    $APPDATA/tuicr/config.toml: tuicr/config.toml
    # Replace the regular file created on machines where pstop already ran.
    $APPDATA/pstop/pstoprc:
      path: pstop/pstoprc
      force: true
    $APPDATA/Code/User/settings.json: vscode/settings.json
    $APPDATA/Code/User/keybindings.json: vscode/keybindings.json

- shell:
  # --module-path points winget at the repo-local dsc/ dir (via %CD%, the repo
  # root dotbot runs from) so it loads the custom CargoGit resource; winget
  # requires an absolute path here, and it's quoted in case the path has spaces.
  - command: winget configure --module-path "%CD%\dsc" configuration.dsc.yaml
    description: Running winget configure
    stdin: true
    stdout: true
    stderr: true
  - command: pwsh -NoProfile -Command "[Environment]::SetEnvironmentVariable('EDITOR', 'nvim', 'User')"
    description: Setting EDITOR=nvim (User scope)
    stdout: true
    stderr: true
  - command: pwsh -NoProfile -File edge/extensions.ps1
    description: Verifying Edge extensions
    stdout: true
    stderr: true
