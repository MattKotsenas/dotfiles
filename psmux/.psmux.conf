# =============================================================================
# psmux config — minimal, opinionated
# =============================================================================

# --- Prefix ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# --- Core (only settings NOT covered by psmux-sensible) ---
set -g default-shell pwsh

# --- Window monitoring ---
# Flag inactive windows in the status bar when they produce output. The Catppuccin
# theme colors the tab via window-status-activity-style (orange text by default).
# TODO: audit window-flag symbols (* - # ! ~ M Z). Several are now redundant with
# the theme's tab coloring; consider filtering #{window_flags} in window-status-format
# to keep only ~ / M / Z (no color equivalents) and drop the rest.
set -g monitor-activity on

# --- Copy mode (vi style, yank to clipboard — no psmux-yank plugin yet) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Catppuccin Mocha theme (psmux-theme-catppuccin) ---
set -g @catppuccin-flavor 'mocha'

# --- Resurrect + Continuum ---
set -g @resurrect-strategy-pwsh 'session'
# Copilot panes: the psmux-session-map copilot hook records each session id by
# pid; the 'copilot' save-command strategy reads it at SAVE time and persists
# `clod --resume=<id>` so restore brings the real session back (not a fresh
# clod). '~clod' whitelists that arg-bearing command for @resurrect-processes.
set -g @resurrect-save-command-strategy 'copilot'
set -g @resurrect-processes '~clod'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins ------------------------------------------------------------
# Sourced from the MattKotsenas/psmux-plugins fork, pinned to the temp/integration
# branch (via ppm's 'owner/repo/subdir#branch' syntax) to dogfood the unmerged
# fork features together: the #branch / 3-segment @plugin syntax (upstream issue
# psmux/psmux-plugins#16), the resurrect restore strategies + global save-command
# strategy, the pane-level restore singleton, and the continuum auto-restore
# singleton. Upstream PR #15 (continuum honor-restore) already landed, so it is no
# longer carried. Repoint each line to 'psmux-plugins/<name>' as features land.
set -g @plugin 'MattKotsenas/psmux-plugins/ppm#temp/integration'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-sensible#temp/integration'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-pain-control#temp/integration'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-resurrect#temp/integration'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-continuum#temp/integration'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-theme-catppuccin#temp/integration'

# Initialize plugin manager (keep at very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Override status-right after theme loads to remove date/time
set -g status-right '#{?client_prefix,#[fg=#fab387]#[bg=#1e1e2e]#[bg=#fab387]#[fg=#11111b,bold] 󰌌 PREF #[fg=#fab387]#[bg=#1e1e2e],}#{?pane_synchronized,#[fg=#fab387]#[bg=#1e1e2e]#[bg=#fab387]#[fg=#11111b,bold] 󰓦 SYNC #[fg=#fab387]#[bg=#1e1e2e],}'

# --- Rebinds for komorebi/kanata CAP-prefix mode -----------------------
# The kanata wm-base layer reserves these prefix keys, so they never reach
# psmux when entered via CAP in Windows Terminal: a/s/d/f/e/w (sub-mode
# entries), r/p/tab/ (globals), and arrow keys. Move the affected psmux
# actions onto letters that ARE in the kanata terminal overlay's PrefixAll
# set so they're reachable via CAP+key. Direct (no-CAP) `prefix <orig key>`
# still works if invoked from inside psmux without the WM layer.
unbind p
bind   b previous-window           # back
unbind w
bind   v choose-tree -Zw           # view windows
unbind s
unbind t
bind   t choose-tree -Zs           # tree (sessions); leaves `m` free for mark-pane
unbind d
bind   u detach-client             # unattach
# psmux 3.3.4 doesn't ship `m`/`M` as defaults the way upstream tmux does
# (`m` = select-pane -m, `M` = -M), so bind them explicitly. Mark a pane
# with `prefix + m`, then `:join-pane` (or swap-pane / etc.) uses the
# marked pane as the source via `{marked}`. `prefix + M` clears the mark.
bind   m select-pane -m
bind   M select-pane -M
# `f` (find-window) and `r` (rare custom) intentionally left as-is; reach
# them via the psmux command prompt (`:find-window <name>` / `:source ~/.psmux.conf`).
# `q` (display-panes) stays on its default key — kanata routes CAP+q through
# the move sub-mode in WM mode, and forwards Ctrl+Space+q in terminal context.
