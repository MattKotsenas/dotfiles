# =============================================================================
# psmux config — minimal, opinionated
# =============================================================================

# --- Prefix ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# --- Core (only settings NOT covered by psmux-sensible) ---
set -g default-shell pwsh

# --- Copy mode (vi style, yank to clipboard — no psmux-yank plugin yet) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Catppuccin Mocha theme (psmux native) ---
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_tabs_enabled on
set -g @catppuccin_status_modules_right 'directory date_time'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'

# Pane borders match Komorebi colors
set -g pane-active-border-style 'fg=#74c7ec'
set -g pane-border-style 'fg=#45475a'

# --- Resurrect + Continuum ---
set -g @resurrect-strategy-pwsh 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins (all from psmux/psmux-plugins monorepo) ---
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-pain-control'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# Initialize plugin manager (keep at very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'
