# =============================================================================
# psmux config — minimal, opinionated
# =============================================================================

# --- Prefix ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# --- Core (only settings NOT covered by psmux-sensible) ---
set -g default-shell pwsh

# --- Window monitoring ---
# Flag inactive windows in the status bar when they produce output. The Catppuccin
# theme colors the tab via window-status-activity-style (orange text by default).
# TODO: audit window-flag symbols (* - # ! ~ M Z). Several are now redundant with
# the theme's tab coloring; consider filtering #{window_flags} in window-status-format
# to keep only ~ / M / Z (no color equivalents) and drop the rest.
set -g monitor-activity on

# --- Copy mode (vi style, yank to clipboard — no psmux-yank plugin yet) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Catppuccin Mocha theme (psmux-theme-catppuccin) ---
set -g @catppuccin-flavor 'mocha'

# --- Resurrect + Continuum ---
set -g @resurrect-strategy-pwsh 'session'
set -g @resurrect-strategy-node 'copilot'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins ------------------------------------------------------------
# Sourced from MattKotsenas/psmux-plugins (fork) instead of psmux/psmux-plugins
# (upstream) to dogfood the A+B @plugin syntax extensions proposed in upstream
# issue psmux/psmux-plugins#16, which is the prerequisite for cleanly dogfooding
# the psmux-continuum auto-restore fix in upstream PR psmux/psmux-plugins#15.
# When both #15 and #16 land upstream, revert to 'psmux-plugins/<name>'.
set -g @plugin 'MattKotsenas/psmux-plugins/ppm'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-sensible'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-pain-control'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-resurrect'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-continuum'
set -g @plugin 'MattKotsenas/psmux-plugins/psmux-theme-catppuccin'

# Initialize plugin manager (keep at very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Override status-right after theme loads to remove date/time
set -g status-right '#{?client_prefix,#[fg=#fab387]#[bg=#1e1e2e]#[bg=#fab387]#[fg=#11111b,bold] 󰌌 PREF #[fg=#fab387]#[bg=#1e1e2e],}#{?pane_synchronized,#[fg=#fab387]#[bg=#1e1e2e]#[bg=#fab387]#[fg=#11111b,bold] 󰓦 SYNC #[fg=#fab387]#[bg=#1e1e2e],}'

# --- Rebinds for komorebi/kanata CAP-prefix mode -----------------------
# The kanata wm-base layer reserves these prefix keys, so they never reach
# psmux when entered via CAP in Windows Terminal: a/s/d/f/e/w (sub-mode
# entries), r/p/tab/q// (globals), and arrow keys. Move the affected psmux
# actions onto letters that ARE in the kanata terminal overlay's PrefixAll
# set so they're reachable via CAP+key. Direct (no-CAP) `prefix <orig key>`
# still works if invoked from inside psmux without the WM layer.
unbind p
bind   b previous-window           # back
unbind w
bind   v choose-tree -Zw           # view windows
unbind s
bind   m choose-tree -Zs           # session menu
unbind q
bind   g display-panes             # grid of pane numbers
unbind d
bind   u detach-client             # unattach
# `f` (find-window) and `r` (rare custom) intentionally left as-is; reach
# them via the psmux command prompt (`:find-window <name>` / `:source ~/.psmux.conf`).

# --- Graveyard: park "done" windows in a detached session ---
# `prefix y` (CAP y) parks the current window in a `graveyard` session
# (created on first use). The window stays alive but disappears from the
# active session's bar.
bind y run-shell "psmux has-session -t graveyard 2>`$null; if (`$LASTEXITCODE -ne 0) { psmux new-session -d -s graveyard }; psmux move-window -s '#{session_name}:#{window_index}' -t graveyard:"
# `prefix i` (CAP i) opens the chooser scoped to the graveyard, then
# pulls the chosen window back into the current session.
bind i choose-tree -Zw -f '#{==:#{session_name},graveyard}' "move-window -s '%%' -t '#{client_session}:'"
