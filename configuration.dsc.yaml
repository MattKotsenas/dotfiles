        Rev: c4c4940146163e03a4cb1872c31cdae701fd2df5
        Crates:
          - wpmctl
          - wpmd
    - resource: CargoGit/CargoGitInstall
      dependsOn:
        - install-rustup
      directives:
        # MattKotsenas fork (main) for in-flight fixes; revert to crates.io grove
        # once upstreamed.
        description: Install grove (git worktree manager; fork, pinned rev)
        allowPrerelease: true
      settings:
        Url: https://github.com/MattKotsenas/grove.git
        Rev: a4d39c4de78d7feff3385b01ec99e528e9ca8ef6
        Crates:
          - grove
    - resource: PSDscResources/Script
      dependsOn:
        - install-psmux
      directives:
        # Bootstrap PPM (psmux's plugin manager) by fetching a pinned commit of
        # the fork (bump $ppmRev in TestScript and SetScript to update PPM) and
        # copying its ppm/ subdir to ~/.psmux/plugins/ppm. install_plugins.ps1
        # then reads ~/.psmux.conf and installs the @plugin entries declared
        # there; those @plugin specs stay unpinned by design (branch-pinned
        # 3-segment specs break psmux's native @plugin auto-source).
        # Test dot-sources ppm.ps1 to reuse PPM's own spec parser and checks a
        # .ppm-rev marker, so it re-bootstraps when $ppmRev moves and reports
        # "in desired state" once PPM is at that rev and every plugin is on disk.
        # Soft dependency on Get-DeclaredPlugins/Resolve-PluginSpec function
        # names in the fork's ppm.ps1; revisit if PPM is restructured upstream.
        description: Bootstrap PPM and install psmux plugins from .psmux.conf
        allowPrerelease: true
      settings:
        GetScript: |
          $ppm = Join-Path $env:USERPROFILE '.psmux\plugins\ppm\ppm.ps1'
          @{ Result = if (Test-Path -LiteralPath $ppm) { 'present' } else { 'absent' } }
        TestScript: |
          $ppmRev = '0f46ccca5a9b748fd03851db00b85fd784f42791'
          $ppm = Join-Path $env:USERPROFILE '.psmux\plugins\ppm\ppm.ps1'
          if (-not (Test-Path -LiteralPath $ppm)) { return $false }
          $marker = Join-Path $env:USERPROFILE '.psmux\plugins\ppm\.ppm-rev'
          if (-not (Test-Path -LiteralPath $marker) -or ((Get-Content -LiteralPath $marker -Raw).Trim() -ne $ppmRev)) { return $false }
          . $ppm
          $declared = Get-DeclaredPlugins
          foreach ($spec in $declared) {
            $info = Resolve-PluginSpec $spec
            if (-not (Test-Path -LiteralPath $info.Path)) { return $false }
          }
          return $true
        SetScript: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          $ppmRev  = '0f46ccca5a9b748fd03851db00b85fd784f42791'
          $ppmDest = Join-Path $env:USERPROFILE '.psmux\plugins\ppm'
          $tmpDir  = Join-Path $env:TEMP 'psmux-plugins'
          if (Test-Path $tmpDir) { Remove-Item $tmpDir -Recurse -Force }
          git init -q $tmpDir 2>&1 | Out-Host
          git -C $tmpDir remote add origin https://github.com/MattKotsenas/psmux-plugins.git 2>&1 | Out-Host
          git -C $tmpDir fetch -q --depth 1 origin $ppmRev 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "git fetch of psmux-plugins $ppmRev failed with exit code $LASTEXITCODE" }
          git -C $tmpDir checkout -q FETCH_HEAD 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "git checkout of psmux-plugins $ppmRev failed with exit code $LASTEXITCODE" }
          $null = New-Item $ppmDest -ItemType Directory -Force
          Copy-Item (Join-Path $tmpDir 'ppm\*') $ppmDest -Recurse -Force -ErrorAction Stop
          Set-Content -LiteralPath (Join-Path $ppmDest '.ppm-rev') -Value $ppmRev
          Remove-Item $tmpDir -Recurse -Force
          & (Join-Path $ppmDest 'scripts\install_plugins.ps1') 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "install_plugins.ps1 failed with exit code $LASTEXITCODE" }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
