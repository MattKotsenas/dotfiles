        Rev: 2793274e62db966004b888914f856d325dc4ecdf
        Crates:
          - tuicr
    - resource: PSDscResources/Script
      directives:
        # mousemaster.exe is a ~122MB GraalVM native image, so it's fetched here
        # (pinned to a release tag) rather than committed to the repo. The
        # mousemaster.properties config is symlinked from the repo by dotbot;
        # the exe lands next to it in ~/.config/mousemaster so mousemaster finds
        # the config. Test verifies the exe's SHA-256 against $sha, so it
        # re-downloads when you bump the release ($tag and $sha below) or if the
        # binary is missing or corrupt.
        # The fork adds the marker consumed by wpm/mousemaster-hook-ready.ps1.
        description: Download mousemaster.exe
        allowPrerelease: true
      settings:
        GetScript: |
          $exe = Join-Path $env:USERPROFILE '.config\mousemaster\mousemaster.exe'
          @{ Result = if (Test-Path -LiteralPath $exe) { (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash } else { 'absent' } }
        TestScript: |
          $sha = '343D76E3814A3E9CCF072644FE97C615F052C57E38E39E4E64C2193152D36B68'
          $exe = Join-Path $env:USERPROFILE '.config\mousemaster\mousemaster.exe'
          (Test-Path -LiteralPath $exe) -and ((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash -eq $sha)
        SetScript: |
          $tag = '89-hook-ready-log'
          $sha = '343D76E3814A3E9CCF072644FE97C615F052C57E38E39E4E64C2193152D36B68'
          $dir = Join-Path $env:USERPROFILE '.config\mousemaster'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/MattKotsenas/mousemaster/releases/download/$tag/mousemaster.exe"
          $exe = Join-Path $dir 'mousemaster.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          if (-not (Test-Path -LiteralPath $exe)) { throw 'mousemaster.exe download failed' }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if ($got -ne $sha) { throw "mousemaster.exe SHA-256 mismatch: expected $sha, got $got" }
    - resource: PSDscResources/Script
      id: copilot-marketplaces
      dependsOn:
        - install-copilot
      directives:
        # Copilot plugins install from marketplaces (GitHub repos with a
        # marketplace.json). `marketplace add` errors on re-run, so Set adds a
        # marketplace only if it isn't registered, else refreshes its catalog so
        # newly published versions are visible. Keys are the names the CLI lists;
        # values are the `add` arguments.
        description: Register Copilot plugin marketplaces
        allowPrerelease: true
      settings:
        GetScript: |
          @{ Result = (copilot plugin marketplace list 2>&1 | Out-String) }
        TestScript: |
          $false
        SetScript: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          $sources = [ordered]@{
            'dotnet-skills' = 'aaronontheweb/dotnet-skills'
            'agent-plugins' = 'mattkotsenas/agent-plugins'
            'grove'         = 'MattKotsenas/grove'
          }
          $have = @(copilot plugin marketplace list 2>&1 | ForEach-Object { if ($_ -match '^\s*\S+\s+([\w.\-]+)\s+\(GitHub:') { $matches[1] } })
          foreach ($name in $sources.Keys) {
            if ($name -in $have) {
              copilot plugin marketplace update $name
              if ($LASTEXITCODE -ne 0) { throw "marketplace update $name failed (exit $LASTEXITCODE)" }
            } else {
              copilot plugin marketplace add $sources[$name]
              if ($LASTEXITCODE -ne 0) { throw "marketplace add $($sources[$name]) failed (exit $LASTEXITCODE)" }
            }
          }
    - resource: PSDscResources/Script
      dependsOn:
        - copilot-marketplaces
      directives:
        # Copilot plugins can't be version-pinned (no --ref flag; the CLI clones
        # the default branch), so Set installs any that aren't present and updates
        # the rest to latest, so no plugin stays frozen at the version that first
        # installed. Same key/value convention as the marketplaces resource above.
        description: Install Copilot plugins
        allowPrerelease: true
      settings:
        GetScript: |
          @{ Result = (copilot plugin list 2>&1 | Out-String) }
        TestScript: |
          $false
        SetScript: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          $plugins = [ordered]@{
            'dotnet-skills@dotnet-skills' = 'dotnet-skills@dotnet-skills'
            'delve@agent-plugins'         = 'delve@agent-plugins'
            'git-good@agent-plugins'      = 'git-good@agent-plugins'
            'prune@agent-plugins'         = 'prune@agent-plugins'
            'toasty@agent-plugins'        = 'toasty@agent-plugins'
            'gnhf@agent-plugins'          = 'gnhf@agent-plugins'
            'tuicr@agent-plugins'         = 'tuicr@agent-plugins'
            'measure-twice@agent-plugins' = 'measure-twice@agent-plugins'
            'grove@grove'                 = 'grove@grove'
            'dotnet-inspect'              = 'richlander/dotnet-inspect'
            'psmux-session-map'           = 'MattKotsenas/dotfiles:copilot/psmux-session-map'
          }
          $have = @(copilot plugin list 2>&1 | ForEach-Object { if ($_ -match '^\s*\S+\s+(\S+)\s+\(v') { $matches[1] } })
          foreach ($name in $plugins.Keys) {
            if ($name -in $have) {
              copilot plugin update $name
              if ($LASTEXITCODE -ne 0) { throw "plugin update $name failed (exit $LASTEXITCODE)" }
            } else {
              copilot plugin install $plugins[$name]
              if ($LASTEXITCODE -ne 0) { throw "plugin install $($plugins[$name]) failed (exit $LASTEXITCODE)" }
            }
          }
    - resource: PSDscResources/Registry
      directives:
        description: Enable UTF-8 for worldwide language support (Beta)
        allowPrerelease: true
      settings:
        Key: HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage
        ValueName: ACP
        ValueData: ['65001']
        ValueType: String
        Force: true
        Ensure: Present
    # IFEO CpuPriorityClass 5 is Below Normal. Leave IoPriority unset because
    # measured disk latency is low and CPU contention is the current bottleneck.
    - resource: PSDscResources/Registry
      directives:
        description: Set future GitHub Copilot CLI launches to below-normal CPU priority
        allowPrerelease: true
      settings:
        Key: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\copilot.exe\PerfOptions
        ValueName: CpuPriorityClass
        ValueData: [5]
        ValueType: Dword
        Force: true
        Ensure: Present
