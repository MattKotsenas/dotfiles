[Unit]
Name = "komorebi"
Description = "tiling window management for Windows"

[Service]
# Forking so wpm tracks komorebi.exe (spawned by komorebic via PowerShell
# Start-Process, which avoids the AllowSetForegroundWindow failure that
# happens when wpmd spawns komorebi.exe directly).
Kind = "Forking"
Autostart = true
Restart = "OnFailure"
RestartSec = 2

[Service.ExecStart]
Executable = "komorebic.exe"
Arguments = [
    "start",
    "--config",
    "$USERPROFILE/.config/komorebi/komorebi.json",
]
Environment = [[
    "KOMOREBI_CONFIG_HOME",
    "$USERPROFILE/.config/komorebi",
]]

[[Service.ExecStop]]
Executable = "komorebic.exe"
Arguments = ["stop"]

[[Service.ExecStopPost]]
Executable = "komorebic.exe"
Arguments = ["restore-windows"]

[Service.Healthcheck.Process]
Target = "komorebi.exe"
DelaySec = 1
