[Unit]
Name = "komorebi"
Description = "tiling window management for Windows"
# whkd dependency removed; hotkeys live in kanata now.
# Re-add "whkd" here (and re-enable the whkd unit) if you ever need it back.

[Service]
Kind = "Simple"
Restart = "OnFailure"
RestartSec = 2

[Service.ExecStart]
# Run komorebi.exe directly so wpm tracks the daemon and not the CLI process.
Executable = "komorebi.exe"
Arguments = [
    "--config",
    "$USERPROFILE/.config/komorebi/komorebi.json",
]
Environment = [[
    "KOMOREBI_CONFIG_HOME",
    "$USERPROFILE/.config/komorebi",
]]

[[Service.ExecStop]]
Executable = "komorebic.exe"
Arguments = ["stop"]

[[Service.ExecStopPost]]
Executable = "komorebic.exe"
Arguments = ["restore-windows"]

[Service.Healthcheck.Command]
Executable = "komorebic.exe"
Arguments = ["state"]
DelaySec = 1
